    <script>document.documentElement.className = 'js';</script>
    <style>
        :root{--paper:#fdfdfb;--ink:#2b3bd1}
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%}
        body{background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100svh;padding:6vh 1.5rem;-webkit-tap-highlight-color:transparent}
        svg{display:block;overflow:visible}
        /* one pen: every stroke on the page is the same blue ballpoint line */
        .pen{fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
        .thin{stroke-width:1.8}
        /* a little tremor in the line, so it reads as a hand and not a font */
        .hand{filter:url(#wobble)}
        a{color:inherit;text-decoration:none;display:block;border-radius:6px}
        a:focus-visible{outline:2px dashed var(--ink);outline-offset:8px}

        .title{width:min(82vw,520px)}
        .title svg{width:100%;height:auto;transform:rotate(-2.5deg)}

        .links{display:flex;align-items:flex-start;justify-content:center;gap:clamp(1.6rem,7vw,3.4rem);margin-top:clamp(4rem,17vh,9rem)}
        .links a{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
        .links svg{height:clamp(46px,8.5vw,60px);width:auto}
        /* scattered on purpose, like they were jotted down one by one */
        .links a:nth-child(1){transform:translateY(0) rotate(-3deg)}
        .links a:nth-child(2){transform:translateY(26px) rotate(2deg)}
        .links a:nth-child(3){transform:translateY(-6px) rotate(-1deg)}
        .links a:nth-child(4){transform:translateY(46px) rotate(4deg)}
        .links .under{opacity:0;transition:opacity .2s}
        @media(hover:hover){
            .links a:nth-child(1):hover{transform:translateY(-4px) rotate(-8deg)}
            .links a:nth-child(2):hover{transform:translateY(22px) rotate(7deg)}
            .links a:nth-child(3):hover{transform:translateY(-10px) rotate(-6deg)}
            .links a:nth-child(4):hover{transform:translateY(42px) rotate(-6deg)}
            .links a:hover .under{opacity:1}
        }
        .links a:active{opacity:.6}

        /* the page writes itself: each stroke is drawn in order, at the speed of a hand */
        .js .pen{stroke-dasharray:1;stroke-dashoffset:1}
        .js .pen.go{animation:draw var(--d,.3s) cubic-bezier(.45,.05,.4,1) var(--at,0s) forwards}
        .js .under{stroke-dasharray:none;stroke-dashoffset:0}
        @keyframes draw{to{stroke-dashoffset:0}}
        @media(prefers-reduced-motion:reduce){.js .pen{stroke-dasharray:none;stroke-dashoffset:0;animation:none}}
    </style>
</head>

    <script>
    // Draw every stroke in order. Longer strokes take longer, like a real hand.
    (function(){
        if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
        var at = .25;
        document.querySelectorAll('.pen:not(.under)').forEach(function(p){
            var len = p.getTotalLength(), d = Math.max(.09, Math.min(.5, len / 520));
            p.style.setProperty('--d', d + 's');
            p.style.setProperty('--at', at + 's');
            p.classList.add('go');
            at += d + .045;
        });
    })();
    </script>
