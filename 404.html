<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Dhruv Pradeep</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <meta name="description" content="This page doesn't exist. Head back home to explore Dhruv Pradeep's work.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=JetBrains+Mono:wght@300;400;500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%}
        body{background:#000;color:#fff;font-family:'Manrope',sans-serif;line-height:1.6}
        ::selection{background:#fff;color:#000}

        .top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:1.5rem 2.5rem;background:linear-gradient(to bottom,rgba(0,0,0,.95),transparent)}
        .back{font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.5);text-decoration:none;transition:color .3s}
        .back:hover{color:#fff}
        .top-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.3)}

        .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:640px;margin:0 auto;padding:8rem 2rem 6rem}
        .art{width:100%;max-width:420px;margin-bottom:2rem;border-radius:20px;overflow:hidden}
        .art img{width:100%;height:auto;display:block}
        .art{cursor:pointer;position:relative}
        .art.spinning img{animation:astro-spin .9s ease}
        @keyframes astro-spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.04)}100%{transform:rotate(360deg) scale(1)}}
        .art-hint{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.3);margin:-1.4rem 0 2rem;text-align:center;opacity:0;animation:fadeUp .9s ease forwards 1.4s}

        h1{font-size:clamp(2rem,5vw,3rem);font-weight:900;letter-spacing:-1.5px;text-transform:uppercase;line-height:1.05;margin-bottom:.8rem}
        .sub{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:1.4rem}
        p.msg{color:rgba(255,255,255,.6);font-size:1rem;margin-bottom:2.4rem}

        .home-btn{display:inline-flex;align-items:center;gap:.7rem;padding:1rem 2.2rem;background:#fff;color:#000;font-family:'JetBrains Mono',monospace;font-size:.75rem;font-weight:500;letter-spacing:2px;text-transform:uppercase;text-decoration:none;border-radius:100px;transition:all .3s}
        .home-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,255,255,.15)}

        @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
        .r{opacity:0;animation:fadeUp .9s ease forwards}
        .r1{animation-delay:.1s}.r2{animation-delay:.25s}.r3{animation-delay:.4s}.r4{animation-delay:.55s}

        .ghost{position:fixed;bottom:-.28em;left:50%;transform:translateX(-50%);font-family:'Manrope',sans-serif;font-size:24vw;font-weight:900;letter-spacing:-.02em;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.07);white-space:nowrap;pointer-events:none;user-select:none;z-index:0}
        .site-foot{position:relative;z-index:2;display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap;padding:1rem 1.5rem 2.5rem}
        .site-foot a{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35);text-decoration:none;padding:.4rem .8rem;transition:color .3s;border:none;font-weight:400}
        .site-foot a:hover{color:#fff;background:none}

        @media(max-width:600px){.top{padding:1.2rem 1.5rem}.wrap{padding-top:6.5rem}}

        /* ---- Display (Inter Bold) ---- */
        h1,.ghost{font-family:'Unbounded',sans-serif;font-weight:800;letter-spacing:-.02em}
    </style>
</head>
<body>
    <div class="top">
        <a class="back" href="/">&larr; Home</a>
        <span class="top-label">404</span>
    </div>

    <div class="wrap">
        <div class="art r r1" id="astro">
            <img src="/assets/404-astronaut.png" alt="An astronaut floating in space, lost, looking at a compass in front of a constellation spelling 404" width="1448" height="1086">
        </div>
        <div class="art-hint">psst — click the astronaut</div>
        <h1 class="r r2" id="msgTitle">Lost the signal.</h1>
        <div class="sub r r2">Error 404</div>
        <p class="msg r r3" id="msgBody">This page drifted off somewhere. It doesn't exist, moved, or never did.</p>
        <a class="home-btn r r4" href="/">Back to Home</a>
    </div>

    <nav class="site-foot">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/now">Now</a>
        <a href="/work">Work</a>
        <a href="/words">Words</a>
        <a href="/posts">Posts</a>
        <a href="/blog">Blog</a>
        <a href="/manifesto">Manifesto</a>
        <a href="/contact">Contact</a>
    </nav>
    <div class="ghost">Dhruv</div>
    <script>
        document.getElementById('astro').addEventListener('click', function(){
            var el = this;
            if (el.classList.contains('spinning')) return;
            el.classList.add('spinning');
            document.getElementById('msgTitle').textContent = 'Found it.';
            document.getElementById('msgBody').textContent = "Compass says home is that way. Taking you there...";
            setTimeout(function(){ window.location.href = '/'; }, 1300);
        });
    </script>
</body>
</html>
