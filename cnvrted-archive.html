    <style>
        :root{
            --paper:#efeee9; --ink:#191917; --ink-2:rgba(25,25,23,.7); --ink-3:rgba(25,25,23,.55);
            --rule:rgba(25,25,23,.2); --blue:#2b3bd1;
            --sans:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif;
            --mono:'JetBrains Mono',ui-monospace,monospace;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
        a{color:inherit;text-decoration:none}
        button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
        :focus-visible{outline:1px solid var(--blue);outline-offset:3px}

        /* the plane */
        #stage{position:fixed;inset:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
        #stage.dragging{cursor:grabbing}
        /* faint dot grid, moved with the camera so the floor feels like it slides */
        #grid{position:absolute;inset:-40px;background-image:radial-gradient(rgba(25,25,23,.16) 1px,transparent 1.2px);background-size:40px 40px;pointer-events:none}
        .fr{position:absolute;left:0;top:0;will-change:transform;padding:0;border-radius:2px;transition:box-shadow .35s ease}
        .fr .in{display:block;width:100%;height:100%;opacity:0;transform:scale(.86) translateY(24px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.16,.84,.32,1)}
        body.live .fr .in{opacity:1;transform:none}
        .fr img{display:block;width:100%;height:100%;object-fit:cover;border-radius:2px;filter:grayscale(.85) contrast(.95) brightness(1.04);transition:filter .45s ease;pointer-events:none;background:#e3e2dc}
        .fr:hover img,.fr:focus-visible img{filter:none}
        .fr:hover{box-shadow:0 22px 60px rgba(25,25,23,.22)}
        .fr .tag{position:absolute;left:0;top:calc(100% + .5rem);white-space:nowrap;font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;color:var(--ink-3);opacity:.0;transition:opacity .3s}
        .fr:hover .tag,.fr:focus-visible .tag{opacity:1}
        .fr .no{position:absolute;right:0;top:calc(100% + .5rem);font-family:var(--mono);font-size:.6rem;color:var(--ink-3)}

        /* chrome */
        .hud{position:fixed;z-index:10;font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);pointer-events:none}
        .hud a,.hud button{pointer-events:auto}
        .top{top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:1.1rem clamp(1.1rem,3.2vw,2.6rem);background:linear-gradient(var(--paper) 40%,rgba(239,238,233,0))}
        .top .logo{text-transform:none;letter-spacing:0;font-size:.78rem;font-weight:500;color:var(--ink)}
        .top .logo span{color:var(--ink-3)}
        .top .mid{color:var(--ink-3)}
        .top .right{justify-self:end}
        .top .right:hover{color:var(--ink)}
        .bl{left:clamp(1.1rem,3.2vw,2.6rem);bottom:1.2rem;line-height:1.8}
        .bl b{font-weight:500;color:var(--ink)}
        .br{right:clamp(1.1rem,3.2vw,2.6rem);bottom:1.2rem;text-align:right;line-height:1.8}
        #mini{display:block;width:120px;height:90px;margin-left:auto;margin-bottom:.5rem;border:1px solid var(--rule);background:rgba(239,238,233,.8)}

        /* title card, fades on first move */
        #intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(1.1rem,3.2vw,2.6rem);pointer-events:none;transition:opacity .9s ease,transform .9s ease}
        #intro.gone{opacity:0;transform:scale(1.04)}
        #intro h1{font-weight:400;font-size:clamp(4.6rem,17vw,15rem);letter-spacing:-.075em;line-height:.82;margin-left:-.05em;mix-blend-mode:multiply}
        #intro hr{border:0;border-top:1px solid var(--ink);margin:1rem 0 .8rem;max-width:min(100%,980px)}
        #intro p{font-size:clamp(1.1rem,2.2vw,1.6rem);letter-spacing:-.03em;max-width:36ch}
        #intro .hint{margin-top:1.2rem;font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
        #intro .hint i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:.5rem;animation:pulse 1.6s infinite}
        @keyframes pulse{50%{opacity:.25}}

        /* lightbox */
        #lb{position:fixed;inset:0;z-index:30;display:grid;grid-template-columns:minmax(0,1fr) 300px;background:rgba(239,238,233,.96);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s}
        #lb.on{opacity:1;pointer-events:auto}
        #lb .pic{display:flex;align-items:center;justify-content:center;padding:4.5rem 2rem 2rem;min-height:0}
        #lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:2px;box-shadow:0 30px 80px rgba(25,25,23,.18)}
        #lb aside{border-left:1px solid var(--rule);padding:4.5rem 1.6rem 1.6rem;display:flex;flex-direction:column}
        #lb .n{font-size:clamp(3rem,6vw,5rem);letter-spacing:-.07em;line-height:.85}
        #lb .of{font-family:var(--mono);font-size:.62rem;color:var(--ink-3);margin-top:.5rem}
        #lb .cap{margin-top:2rem;font-size:1.45rem;letter-spacing:-.035em;line-height:1.15}
        #lb .meta{margin-top:1rem;font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
        #lb .nav{margin-top:auto;display:flex;gap:1.6rem;font-size:1.05rem;color:var(--blue)}
        #lb .x{position:absolute;top:1.1rem;right:clamp(1.1rem,3.2vw,2.6rem);font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
        @media(max-width:760px){
            #lb{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
            #lb .pic{padding:4rem 1rem 1rem}
            #lb aside{border-left:0;border-top:1px solid var(--rule);padding:1.1rem 1.1rem 1.4rem}
            #lb .n{font-size:2.4rem}#lb .cap{margin-top:.8rem;font-size:1.15rem}#lb .nav{margin-top:1rem}
            #mini{display:none}.top .mid{display:none}.top{grid-template-columns:1fr auto}
        }
        @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
    </style>
    <script type="application/ld+json">

<body>
    <div id="stage" aria-label="Photo archive. Drag, scroll or use arrow keys to move around; press Enter on a photo to open it.">
        <div id="grid"></div>
    </div>

    <div id="intro">
        <h1>archive</h1>
        <hr>
        <p>Building Cnvrted, in frames. Late nights, small rooms, a lot of biryani.</p>
        <span class="hint"><i></i>Drag anywhere &middot; it doesn&rsquo;t end</span>
    </div>

    <header class="hud top">
        <a class="logo" href="/">dhruv/<span>cnvrted/archive</span></a>
        <span class="mid" id="count">39 frames</span>
        <a class="right" href="/cnvrted">&larr; founder&rsquo;s log</a>
    </header>
    <div class="hud bl">
        <div>x <b id="cx">0</b> &nbsp; y <b id="cy">0</b></div>
        <div id="state">idle</div>
    </div>
    <div class="hud br">
        <canvas id="mini" width="240" height="180" aria-hidden="true"></canvas>
        <div>drag &middot; scroll &middot; &larr;&uarr;&rarr;&darr;</div>
    </div>

    <div id="lb" role="dialog" aria-modal="true" aria-label="Photo">
        <button class="x" id="lbX">Close &times;</button>
        <div class="pic"><img id="lbImg" alt=""></div>
        <aside>
            <div class="n" id="lbN">01</div>
            <div class="of" id="of">/ 39</div>
            <p class="cap" id="lbCap"></p>
            <p class="meta" id="lbMeta"></p>
            <div class="nav"><button id="lbPrev">&larr; prev</button><button id="lbNext">next &rarr;</button></div>
        </aside>
    </div>

    <script>
    (function(){
        // [file index, width, height, caption, meta]
        var FRAMES = [
            [17, 2000, 1500, 'Cnvrted Pvt. Ltd., on paper.', 'day one, officially'],
            [39, 1125, 2000, 'Good evening, Dhruv.', 'the product, live'],
            [1, 1500, 2000, 'Tea, Slack, and the growth plan.', 'night &middot; outdoors'],
            [20, 1500, 2000, 'Cnvrt more. Close faster.', 'caf&eacute; &middot; the landing page'],
            [2, 1196, 377, 'Co-founder, Cnvrted. Full-time since May 2026.', 'linkedin'],
            [21, 2000, 1500, 'Saad &lt;&gt; Cnvrted, in 25 minutes.', 'matcha first'],
            [15, 1500, 2000, 'BHIVE, after dark.', 'the building'],
            [22, 1079, 1346, 'Then the call itself.', 'google meet'],
            [12, 1500, 2000, 'Our room was called London.', 'bhive'],
            [33, 1125, 2000, 'The whiteboard runs the day.', 'to-do'],
            [7, 1500, 2000, 'Three screens, one head down.', 'late'],
            [23, 1200, 1600, 'Arms crossed outside JK Plaza.', 'night'],
            [6, 1500, 2000, 'Every one of us got a mascot.', 'huddle'],
            [37, 782, 1600, 'The 2 a.m. part.', 'head in hands'],
            [9, 1500, 2000, 'The sticker wall, in Figma.', 'brand'],
            [24, 1079, 582, 'Calls with users, wherever they are.', 'on a call'],
            [8, 1500, 2000, 'Reading the code very closely.', 'shipping'],
            [30, 1200, 1600, 'The pink helmet.', 'non-negotiable'],
            [10, 720, 1280, 'Four hands, three laptops.', 'heads down'],
            [26, 1125, 2000, 'Three laptops, one table.', 'from above'],
            [11, 1500, 2000, 'We wrote our name on the wall.', 'cnvrted.com'],
            [27, 744, 414, 'Usage limit: 98%.', 'claude, again'],
            [13, 1125, 1500, 'Biryani is a sprint ritual.', 'fuel'],
            [29, 1125, 2000, 'Chai stop, between meetings.', 'the street'],
            [5, 1500, 2000, 'Power nap, between deploys.', 'bhive'],
            [28, 1080, 751, 'Funding call: cancelled.', 'it happens'],
            [14, 2000, 1500, 'The office, when everyone has gone.', 'late'],
            [32, 1125, 2000, 'Diet Coke, glass room.', 'bhive'],
            [16, 1500, 2000, 'CEO,000,0000.', 'on a train'],
            [25, 1500, 2000, 'Caught mid-grin.', 'by the window'],
            [4, 1500, 2000, 'Night ride past Vidhana Soudha.', 'bengaluru'],
            [36, 1125, 2000, 'Spotify on the big screen.', 'late'],
            [18, 1080, 810, 'Two by the lake. Thinking it through.', 'off-site'],
            [34, 1200, 1599, 'Fried rice and Sprite.', 'team dinner'],
            [19, 1500, 1125, 'Working from the steps at sunset.', 'off-site'],
            [31, 1200, 1600, 'Lunch, one-handed.', 'fuel'],
            [3, 1206, 1216, 'Mood, most weeks.', 'found on the internet'],
            [35, 1200, 1599, 'FLAMES, on the office whiteboard.', 'break time'],
            [38, 900, 1600, 'Gelato is a reward system.', 'after shipping']
        ];
        var N = FRAMES.length;
        var stage = document.getElementById('stage'), grid = document.getElementById('grid');
        var intro = document.getElementById('intro');
        var cxEl = document.getElementById('cx'), cyEl = document.getElementById('cy'), stEl = document.getElementById('state');
        document.getElementById('count').textContent = N + ' frames';

        // deterministic scatter so the layout is the same on every visit
        var seed = 7; function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
        var COLS = 8, ROWS = Math.ceil(N / COLS), W, H, cellW, cellH, nodes = [];

        function layout(){
            var vw = innerWidth, vh = innerHeight, small = vw < 760;
            cellW = Math.max(small ? 330 : 540, (vw + 760) / COLS);
            cellH = Math.max(small ? 360 : 480, (vh + 640) / ROWS);
            W = COLS * cellW; H = ROWS * cellH;
            seed = 7;
            nodes.forEach(function(n, k){
                var f = n.f, ratio = f[1] / f[2];
                var z = 0.84 + rnd() * 0.32;          // depth: nearer frames are bigger and move faster
                var base = (small ? 150 : 215) * z * (0.9 + rnd() * 0.3);
                var w = ratio >= 1 ? base * Math.min(ratio, 1.8) : base, h = w / ratio;
                var col = k % COLS, row = Math.floor(k / COLS);
                n.w = w; n.h = h;
                n.x = col * cellW + rnd() * Math.max(10, cellW - w - 40) + 20;
                n.y = row * cellH + rnd() * Math.max(10, cellH - h - 70) + 30;
                n.z = z;
                n.el.style.width = w + 'px'; n.el.style.height = h + 'px';
                n.el.style.zIndex = Math.round(n.z * 100);
            });
        }

        FRAMES.forEach(function(f, k){
            var b = document.createElement('button');
            b.className = 'fr';
            b.setAttribute('aria-label', 'Frame ' + (k + 1) + ': ' + f[3].replace(/&middot;/g, '·'));
            var id = (f[0] < 10 ? '0' : '') + f[0];
            b.innerHTML = '<span class="in" style="transition-delay:' + Math.round(k * 1300 / N) + 'ms"><img src="/assets/cnvrted/archive/' + id + '-t.webp" alt="" decoding="async">' +
                '<span class="tag">' + f[3] + '</span><span class="no">' + (k < 9 ? '0' : '') + (k + 1) + '</span></span>';
            b.dataset.k = k;
            // keyboard Enter/Space; pointer taps are handled on the stage because it captures the pointer
            b.addEventListener('click', function(e){ if(e.detail === 0) openLb(k); });
            stage.appendChild(b);
            nodes.push({el: b, f: f});
        });
        layout();

        // camera with inertia
        var cam = {x: W * 0.12, y: H * 0.08}, vel = {x: 0, y: 0}, drift = {x: 0, y: 0};
        var down = false, moved = false, last = {x: 0, y: 0}, lastT = 0, hover = {x: 0.5, y: 0.5};
        var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

        function wake(){ if(!intro.classList.contains('gone')){ intro.classList.add('gone'); document.body.classList.add('live'); } }
        setTimeout(wake, 1800);
        stage.addEventListener('pointerdown', function(e){
            down = true; moved = false; last = {x: e.clientX, y: e.clientY}; lastT = performance.now();
            vel.x = vel.y = 0; stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId);
        });
        stage.addEventListener('pointermove', function(e){
            hover = {x: e.clientX / innerWidth, y: e.clientY / innerHeight};
            if(!down) return;
            var dx = e.clientX - last.x, dy = e.clientY - last.y, now = performance.now(), dt = Math.max(1, now - lastT);
            if(Math.abs(dx) + Math.abs(dy) > 3){ moved = true; wake(); }
            cam.x -= dx; cam.y -= dy;
            vel.x = -dx / dt * 16; vel.y = -dy / dt * 16;
            last = {x: e.clientX, y: e.clientY}; lastT = now;
        });
        function up(e){
            var wasTap = down && !moved;
            down = false; stage.classList.remove('dragging'); if(reduce){ vel.x = vel.y = 0; }
            if(wasTap && e.type === 'pointerup'){
                var hit = document.elementFromPoint(e.clientX, e.clientY);
                var fr = hit && hit.closest('.fr');
                if(fr){ vel.x = vel.y = 0; openLb(+fr.dataset.k); }
            }
        }
        stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
        addEventListener('wheel', function(e){ e.preventDefault(); wake(); cam.x += e.deltaX; cam.y += e.deltaY; }, {passive: false});
        addEventListener('keydown', function(e){
            if(lb.classList.contains('on')){
                if(e.key === 'Escape') closeLb();
                if(e.key === 'ArrowRight') step(1);
                if(e.key === 'ArrowLeft') step(-1);
                return;
            }
            var k = {ArrowLeft: [-60, 0], ArrowRight: [60, 0], ArrowUp: [0, -60], ArrowDown: [0, 60]}[e.key];
            if(k){ e.preventDefault(); wake(); vel.x += k[0] / 4; vel.y += k[1] / 4; }
        });
        addEventListener('resize', layout);

        function mod(a, m){ return ((a % m) + m) % m; }
        var mini = document.getElementById('mini'), mc = mini.getContext('2d');

        function frame(){
            if(!down){
                cam.x += vel.x; cam.y += vel.y;
                vel.x *= 0.94; vel.y *= 0.94;
                // the plane breathes towards the cursor when idle
                if(!reduce){ drift.x += ((hover.x - 0.5) * 1.4 - drift.x) * 0.05; drift.y += ((hover.y - 0.5) * 1.4 - drift.y) * 0.05; cam.x += drift.x; cam.y += drift.y; }
            }
            var vw = innerWidth, vh = innerHeight;
            for(var i = 0; i < nodes.length; i++){
                var n = nodes[i];
                // each frame wraps on its own, so the wall never runs out
                var px = mod(n.x - cam.x * n.z + n.w, W) - n.w;
                var py = mod(n.y - cam.y * n.z + n.h, H) - n.h;
                n.el.style.transform = 'translate3d(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px,0)';
                n.el.style.visibility = (px > vw + 40 || py > vh + 60) ? 'hidden' : 'visible';
            }
            grid.style.transform = 'translate3d(' + (-mod(cam.x * 0.5, 40)) + 'px,' + (-mod(cam.y * 0.5, 40)) + 'px,0)';
            cxEl.textContent = Math.round(cam.x); cyEl.textContent = Math.round(-cam.y);
            var speed = Math.abs(vel.x) + Math.abs(vel.y);
            stEl.textContent = down ? 'dragging' : speed > 0.4 ? 'drifting ' + speed.toFixed(1) : 'idle';

            // minimap: the tile, the frames, and where the viewport sits on it
            var sx = mini.width / W, sy = mini.height / H;
            mc.clearRect(0, 0, mini.width, mini.height);
            mc.fillStyle = 'rgba(25,25,23,.28)';
            nodes.forEach(function(n){ mc.fillRect(n.x * sx, n.y * sy, Math.max(3, n.w * sx), Math.max(3, n.h * sy)); });
            mc.strokeStyle = '#2b3bd1'; mc.lineWidth = 2;
            mc.strokeRect(mod(cam.x, W) * sx, mod(cam.y, H) * sy, vw * sx, vh * sy);
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        // lightbox
        var lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), cur = 0, opener = null;
        function show(k){
            cur = (k + N) % N; var f = FRAMES[cur], id = (f[0] < 10 ? '0' : '') + f[0];
            lbImg.src = '/assets/cnvrted/archive/' + id + '-f.webp';
            lbImg.alt = f[3].replace(/&middot;/g, '·');
            document.getElementById('lbN').textContent = (cur < 9 ? '0' : '') + (cur + 1);
            document.getElementById('lbCap').innerHTML = f[3];
            document.getElementById('lbMeta').innerHTML = f[4];
        }
        function openLb(k){ opener = document.activeElement; show(k); lb.classList.add('on'); document.getElementById('lbX').focus(); }
        function closeLb(){ lb.classList.remove('on'); if(opener) opener.focus(); }
        function step(d){ show(cur + d); }
        document.getElementById('lbX').addEventListener('click', closeLb);
        document.getElementById('lbPrev').addEventListener('click', function(){ step(-1); });
        document.getElementById('lbNext').addEventListener('click', function(){ step(1); });
        lb.addEventListener('click', function(e){ if(e.target === lb || e.target.classList.contains('pic')) closeLb(); });
    })();
    </script>
</body>
